name: iOS - TestFlight / App Store

# Build SIGNE + envoi automatique sur TestFlight.
#
# Secrets a creer dans Settings > Secrets and variables > Actions :
#   IOS_CERT_P12_BASE64      certificat "Apple Distribution" exporte en .p12, encode base64
#   IOS_CERT_P12_PASSWORD    mot de passe du .p12
#   IOS_PROVISION_BASE64     profil de provisioning App Store (.mobileprovision) en base64
#   IOS_PROVISION_NAME       nom exact du profil (ex. "Bousole App Store")
#   IOS_TEAM_ID              identifiant d'equipe Apple Developer (10 caracteres)
#   ASC_KEY_ID               cle API App Store Connect (10 caracteres)
#   ASC_ISSUER_ID            issuer ID App Store Connect (UUID)
#   ASC_KEY_P8_BASE64        fichier AuthKey_XXXXXXXXXX.p8 encode base64
#
# Pour encoder un fichier en base64 :  base64 -i fichier -o fichier.txt  (macOS)
#                                      certutil -encode fichier fichier.txt  (Windows)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version affichee sur l'App Store (ex. 1.0.2)"
        required: true
        default: "1.0.1"
      upload:
        description: "Envoyer sur TestFlight apres le build"
        type: boolean
        required: true
        default: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Capacitor dependencies
        working-directory: edtrack-capacitor
        run: npm ci || npm install

      - name: Sync Capacitor iOS
        working-directory: edtrack-capacitor
        run: ./node_modules/.bin/cap sync ios

      # --- Signature : certificat + profil dans un trousseau temporaire ---------
      - name: Import signing certificate and provisioning profile
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
          PROVISION_B64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISION_B64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # Xcode 16 lit les profils ici ; l'ancien chemin reste accepte.
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Set version and build number
        run: |
          set -euo pipefail
          # Info.plist lit $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION) : on
          # passe les valeurs a xcodebuild, sans toucher au fichier.
          # Le numero de build doit etre unique a chaque envoi : run_number s'en charge.
          echo "MARKETING_VERSION=${{ inputs.marketing_version }}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Resolve Swift Package dependencies
        working-directory: edtrack-capacitor/ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Archive (signed)
        working-directory: edtrack-capacitor/ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Bousole.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISION_NAME }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.edtrack.app</key>
              <string>${{ secrets.IOS_PROVISION_NAME }}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bousole.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool cherche la cle dans ce dossier, nommee AuthKey_<KEY_ID>.p8
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bousole-iOS-${{ inputs.marketing_version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Clean up keychain and secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f ~/.private_keys/AuthKey_*.p8 || true
          rm -f "$RUNNER_TEMP"/cert.p12 "$RUNNER_TEMP"/profile.mobileprovision || true
