name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify Node version
        run: |
          node --version
          npm --version

      - name: Install Capacitor dependencies
        working-directory: edtrack-capacitor
        run: npm install

      - name: Sync Capacitor iOS
        working-directory: edtrack-capacitor
        run: ./node_modules/.bin/cap sync ios

      - name: Disable ATS (allow HTTP) in Info.plist
        working-directory: edtrack-capacitor
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST" 2>/dev/null || true
          echo "ATS disabled"

      - name: Resolve Swift Package dependencies
        working-directory: edtrack-capacitor/ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      - name: Build IPA (unsigned - SPM, no CocoaPods)
        working-directory: edtrack-capacitor/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/Eductrack.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/Eductrack.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist $GITHUB_WORKSPACE/edtrack-capacitor/ios-export-options.plist \
            || true
          # Fallback: extract .app from archive manually
          find $RUNNER_TEMP/Eductrack.xcarchive -name "*.app" -exec cp -r {} $RUNNER_TEMP/ipa/ \;

      - name: Package as IPA
        run: |
          cd $RUNNER_TEMP/ipa
          APP=$(find . -name "*.app" | head -1)
          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r Eductrack.ipa Payload/
            echo "IPA created successfully"
          else
            echo "No .app found, listing archive contents:"
            find $RUNNER_TEMP/Eductrack.xcarchive -type f | head -30
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eductrack-iOS
          path: |
            ${{ runner.temp }}/ipa/Eductrack.ipa
            ${{ runner.temp }}/ipa/*.app
          retention-days: 30
          if-no-files-found: warn
