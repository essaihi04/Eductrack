server {
    listen 80;
    listen [::]:80;
    server_name etrack.ma www.etrack.ma;

    # Redirection vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name etrack.ma www.etrack.ma;

    # Certificats SSL (seront générés par Certbot)
    ssl_certificate /etc/letsencrypt/live/etrack.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etrack.ma/privkey.pem;

    # Configuration SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory
    root /var/www/Eductrack/frontend/dist;
    index index.html;

    # Taille max des uploads (cahier de vie : plusieurs photos)
    client_max_body_size 60M;

    # Logs
    access_log /var/log/nginx/etrack_access.log;
    error_log /var/log/nginx/etrack_error.log;

    # API Backend
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Imports volumineux (création de comptes élèves) : éviter le 504
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # index.html — JAMAIS mis en cache : l'app mobile (WebView Capacitor) doit
    # toujours voir le dernier déploiement, sinon elle garde l'ancien bundle
    # des jours durant (heuristique de cache sans Cache-Control).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Service worker — toujours revalidé (sinon les mises à jour push n'arrivent pas)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers uploadés (photos objets perdus, activités, logos...)
    # ^~ force la priorité sur le bloc regex *.jpg ci-dessous
    location ^~ /uploads/ {
        alias /var/www/Eductrack/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
